name: fetch-media
# Builds the README/website media from frames rendered by Earth Engine:
# one PNG per fully observed year of Lake Urmia (no data gaps) + 4 panel years.
on:
  push:
    paths: ['.github/workflows/fetch-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Earth Engine frames
        run: |
          mkdir -p frames panels docs
          EE=https://earthengine.googleapis.com/v1/projects/risarezaei/thumbnails
          while read -r y id; do curl -fsSL --retry 3 -o frames/$y.png "$EE/$id:getPixels"; done <<'EOF'
          1984 d0a75b52c58df7748fadf1f7fc694fb5-0b3cc8cf0cfa3bdc8ce7f4ef0e5d8dd7
          1986 09ade36c99ef81a80d1345fab8290df3-839a246abac5b98b8b379cbe99d7646e
          1987 2a163180f6bd721cd3f72b5bd9935958-dc881a164801990b898eecdc86f4b5f0
          1998 de097c7bff98e12c5f19dcc80cea5c53-54bd401b415e6d196c690019b5fbd1bd
          1999 017554db0b65b33f86f1fb9bff4407f9-c1ce884dd6bc7dcc57ba5465716c48dc
          2000 6c702732678d62b93915c73ea9d46cdd-416cff71d14ed648920ccef0f624a952
          2001 dce940eb309ca4a00d71fbfe73325801-25a080f9721cbeb5d2db0a0e24bba61b
          2002 20e3970a42257ec0d24ba2cc377d59e8-202afa7b63513d8473b955d0040458af
          2003 1070925df6d19ab78ef0535550d549ef-05f0fda9aa86265d3f7c9479b57e479c
          2004 7621a2322e2bba27e3e8c437cd3d26b1-7d62c33c8cbb2fee55c51fc9af887510
          2005 8f59bbc1955a28054bfb0943e3ae9841-f0967996932c16dc380553f03b24f786
          2006 33718ccd2ddfffe7829e02341e68b77e-11e469eb8b6a08c89273790e3331f7c8
          2007 08a10b1b4580c2eaf9c9048b5ea2287a-ef7efc9967b7f654236f6f8326513ec7
          2008 1c98f2b035a434f53916c66aa46ecd24-6c4b1baeb62f0a4d67ee467c5065af4a
          2009 21da9897a6acac6ee3e599ce8c5d97a5-2fee4a8aa1451e27ab7fc5bb7a5100a3
          2010 8f97bb4eefbb5367066d4b4039dc1cae-15a2afc875bcd1ab8759995436b331ec
          2011 1af52afd8357cedf7c5563ccaa5aa587-cccfa77c52992ae594acf70c976481e6
          2012 8c350944dae20ab0d8713cc4f10eb774-93262127d0b3f00c92995b759500bbbf
          2013 34d963358ad113b2044c3d28051051e7-a646039ecf4317a418cdd50594226006
          2014 21c4fcf5d771d52b27221fbaa41d00be-2b3d239b92ad116643422db682ce92ec
          2015 9efd03da1cd0a6696fee9cb9796bb05d-6752629e0d28ee6f5b5861ebef3b423e
          2016 17131b0ce2dec428748ab3e9bcf47f28-5d97a2cc5d9deef4b1e96f59e68ec1b9
          2017 4e061e44fe1ae0d6050d8f0d010f313f-bc1fd47a8e48e2f6d64e9eccb28a7387
          2018 93c9acbaf7a7c4a6c3ed703dac094b6a-665e10c1a824cdfb476b8a4c12a88e1c
          2019 cd377619d2d30bd87a04f4f72f5da56e-434a19dd08e27639a5b848c30b08d487
          2020 7058c068d3191589b8862e62ac9aea45-515dd5e0b0012636cca065d25cf2bdcb
          2021 bf7ad62464d1f146fbde6a86b12b3f02-6b2f69b782a0133a5e663d8037c196e4
          EOF
          while read -r y id; do curl -fsSL --retry 3 -o panels/$y.png "$EE/$id:getPixels"; done <<'EOF'
          1998 254a4bdf679a60947cdd4de293eadbc1-a1d2ed1e920d947111435f77508215fb
          2008 8bf0576a51028f7b3f99eb473e06a1e1-5a59a1e595f072d209a9ddb978286ce9
          2015 29fc6d93866f5346aba448197c53fa54-d72d2b6309a186217e467072311f168c
          2021 0cbc4e1a13fefc0a105795228bc36cc1-17172d222703a3a69ba7f968327c08dd
          EOF
      - name: Check that every image is complete
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y imagemagick ffmpeg > /dev/null
          test $(ls frames/*.png | wc -l) -eq 27
          for f in frames/*.png; do test "$(identify -format '%wx%h' $f)" = "329x480" || { echo "bad size $f"; exit 1; }; done
          for f in panels/*.png; do test "$(identify -format '%wx%h' $f)" = "357x520" || { echo "bad size $f"; exit 1; }; done
          # no transparent pixels anywhere (a missing tile would be transparent)
          for f in frames/*.png panels/*.png; do
            a=$(convert $f -alpha extract -threshold 99% -format '%[fx:minima]' info:)
            test "$a" = "1" || { echo "transparent pixels in $f"; exit 1; }
          done
      - name: Build timelapse GIF/MP4, small multiples and card
        run: |
          ls frames/*.png | sort > list.txt
          last=$(tail -n 1 list.txt)
          convert -delay 45 $(grep -v "$last" list.txt) -delay 200 "$last" -loop 0 -layers Optimize docs/timelapse.gif
          i=0; mkdir -p seq; while read -r f; do n=1; [ "$f" = "$last" ] && n=4; for k in $(seq $n); do cp "$f" seq/$(printf '%04d' $i).png; i=$((i+1)); done; done < list.txt
          ffmpeg -loglevel error -y -framerate 2 -i seq/%04d.png -vf "scale=658:960:flags=neighbor,format=yuv420p" \
            -r 30 -movflags faststart docs/timelapse.mp4
          for y in 1998 2008 2015 2021; do convert panels/$y.png -bordercolor white -border 12 panels/b$y.png; done
          convert panels/b1998.png panels/b2008.png panels/b2015.png panels/b2021.png +append docs/preview.png
          convert panels/b1998.png panels/b2015.png panels/b2021.png +append \
            -resize 720x450 -background white -gravity center -extent 720x450 -quality 90 docs/card.jpg
          rm -rf frames panels seq list.txt
          identify docs/timelapse.gif | wc -l; identify docs/preview.png docs/card.jpg; ls -la docs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Add Earth Engine renders (timelapse GIF/MP4, small multiples, card)"
          git push
