name: fetch-media
# One-off: downloads the README/website images rendered by Earth Engine
# (labelled timelapse + small multiples of Lake Urmia) and commits them to docs/.
on:
  push:
    paths: ['.github/workflows/fetch-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Earth Engine renders
        run: |
          mkdir -p docs
          curl -fsSL -o docs/timelapse.gif "https://earthengine.googleapis.com/v1/projects/risarezaei/videoThumbnails/c0a91635dec36b3a5c13ccd99b135e43-8023d757c7f13c63251795c113d485b7:getPixels"
          curl -fsSL -o docs/preview.png "https://earthengine.googleapis.com/v1/projects/risarezaei/thumbnails/27140699f16cf027809603b80c729804-4cd67516d4fbcfd9eb2b24800afc381f:getPixels"
          curl -fsSL -o card.png "https://earthengine.googleapis.com/v1/projects/risarezaei/thumbnails/9dc39f94123c4afc4fb52425d2f11482-5ea374877e0cb5767ee89f68cb624ea6:getPixels"
      - name: Card image (720x450 jpg) and MP4 version of the timelapse
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y imagemagick ffmpeg > /dev/null
          convert card.png -resize 720x450 -background white -gravity center -extent 720x450 -quality 88 docs/card.jpg
          ffmpeg -loglevel error -y -i docs/timelapse.gif -movflags faststart -pix_fmt yuv420p \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" docs/timelapse.mp4
          rm card.png
          ls -la docs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Add Earth Engine renders (timelapse, small multiples, card)"
          git push
